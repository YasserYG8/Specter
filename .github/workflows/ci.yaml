name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        go-version: [ '1.26', 'stable' ]
        include:
          # A real arm64 kernel: ptrace does not work under emulation, so this is the only way to run Specter on arm64
          - os: ubuntu-24.04-arm
            go-version: stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y strace lsof iproute2

      - name: Verify code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Configure kernel ptrace permissions
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Check systemd journal access
        run: |
          journalctl --no-pager -n 5 || true
          sudo usermod -a -G systemd-journal $USER || true

      - name: Run unit & stress tests (with race detector)
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./cmd/... ./internal/... ./test/stress/... ./test/bench/...

      - name: Run E2E integration tests
        run: go test -v -timeout=10m ./test/e2e/...

  # The binaries for the distribution tests are built once here, statically, and every distribution runs the same files
  distro-binaries:
    name: Build static test binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build static binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          go build -o bin/specter ./cmd/specter
          go build -o bin/testserver ./test/e2e/testserver
          go test -c -o bin/e2e.test ./test/e2e
          go test -c -o bin/strace.test ./internal/source/strace
          go test -c -o bin/resolver.test ./internal/resolver

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: distro-binaries
          path: bin/
          retention-days: 3

  # This tests what differs between distributions: the strace version, the C library (Alpine uses musl) and the
  # tools. Containers share the runner's kernel, so it does NOT test other kernels.
  distros:
    name: Distribution userland, not kernels (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: distro-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq strace lsof iproute2
          - image: debian:12
            install: apt-get update -qq && apt-get install -y -qq strace lsof iproute2
          - image: fedora:41
            install: dnf install -y -q strace lsof iproute
          - image: alpine:3.21
            install: apk add --no-cache strace lsof iproute2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: distro-binaries
          path: bin

      - name: Configure kernel ptrace permissions
        run: |
          chmod +x bin/*
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Run the tests in ${{ matrix.image }}
        env:
          INSTALL: ${{ matrix.install }}
        run: |
          docker run --rm --cap-add SYS_PTRACE \
            -v "$PWD":/work \
            -e INSTALL \
            -e SPECTER_BIN=/work/bin/specter \
            -e TESTSERVER_BIN=/work/bin/testserver \
            ${{ matrix.image }} sh /work/scripts/ci-distro-tests.sh

  # The eBPF engine needs root and a kernel with type information, which the virtual machines of these runners have.
  # SPECTER_REQUIRE_EBPF=1 makes a test that would skip for lack of eBPF fail instead, so the coverage cannot be lost
  # in silence. The test programs are built as a normal user and only run as root.
  ebpf:
    name: eBPF engine as root (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y strace lsof iproute2

      - name: What this machine offers
        run: |
          uname -srm
          ls -la /sys/kernel/btf/vmlinux || echo "NO BTF"

      - name: Configure kernel ptrace permissions
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Build the test programs (as a normal user)
        run: |
          mkdir -p "$RUNNER_TEMP/ebpf"
          go build -o "$RUNNER_TEMP/ebpf/specter" ./cmd/specter
          go build -o "$RUNNER_TEMP/ebpf/testserver" ./test/e2e/testserver
          go test -c -o "$RUNNER_TEMP/ebpf/e2e.test" ./test/e2e
          go test -c -o "$RUNNER_TEMP/ebpf/ebpf.test" ./internal/source/ebpf

      - name: Run the eBPF source tests as root
        shell: bash
        run: |
          cd internal/source/ebpf
          sudo "$RUNNER_TEMP/ebpf/ebpf.test" -test.v -test.timeout=5m | tee "$RUNNER_TEMP/ebpf/unit.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/ebpf/unit.log"; then
            echo "A test was skipped, so it proved nothing:"
            grep -- '--- SKIP' "$RUNNER_TEMP/ebpf/unit.log"
            exit 1
          fi

      - name: Run the E2E suite as root, with eBPF required
        shell: bash
        run: |
          cd test/e2e
          sudo env SPECTER_REQUIRE_EBPF=1 \
            SPECTER_BIN="$RUNNER_TEMP/ebpf/specter" TESTSERVER_BIN="$RUNNER_TEMP/ebpf/testserver" \
            "$RUNNER_TEMP/ebpf/e2e.test" -test.v -test.timeout=10m | tee "$RUNNER_TEMP/ebpf/e2e.log"
          if grep -E -- '--- SKIP.*(ebpf|EBPF)' "$RUNNER_TEMP/ebpf/e2e.log"; then
            echo "An eBPF test was skipped, so eBPF coverage was lost."
            exit 1
          fi

  # The compiled BPF program is committed, so building needs no C compiler. This job regenerates it with clang 18
  # (the version the committed files were made with) and fails if the result differs, which would mean the C source
  # was changed without regenerating.
  ebpf-generated:
    name: Committed BPF program is current
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libbpf-dev
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          clang --version

      - name: Regenerate and compare
        run: |
          go generate ./internal/source/ebpf
          git status --short internal/source/ebpf
          if ! git diff --exit-code -- internal/source/ebpf; then
            echo "The committed BPF files differ from the C source. Run: go generate ./internal/source/ebpf"
            exit 1
          fi
          if [ -n "$(git status --porcelain internal/source/ebpf)" ]; then
            echo "Regenerating changed these files:"
            git status --porcelain internal/source/ebpf
            exit 1
          fi

  build:
    name: Build & Cross-Compilation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Linux (amd64)
        run: GOOS=linux GOARCH=amd64 go build -v -o ./bin/specter-linux-amd64 ./cmd/specter

      - name: Build Linux (arm64)
        run: GOOS=linux GOARCH=arm64 go build -v -o ./bin/specter-linux-arm64 ./cmd/specter

      - name: Build macOS (arm64)
        run: GOOS=darwin GOARCH=arm64 go build -v -o ./bin/specter-darwin-arm64 ./cmd/specter

      - name: Build Windows (amd64)
        run: GOOS=windows GOARCH=amd64 go build -v -o ./bin/specter-windows-amd64.exe ./cmd/specter

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

