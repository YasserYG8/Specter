schema: spec-driven

context: |
  Project: Specter
  Domain: Linux-first systems developer CLI for live server log streaming by port or PID.
  Tech stack:
    - Language: Go 1.24+
    - CLI: github.com/spf13/cobra
    - Testing: Go standard library `testing` with table-driven tests & fixtures
    - Subprocesses: `os/exec` with `context.Context`
    - Output: ANSI terminal formatting (respecting NO_COLOR and non-TTY)
    - Architecture: Modular pipeline (Resolver -> Source -> Assembler -> Parser -> Filter -> Renderer)
  Platform: Linux-first (with WSL2 support on Windows development machines).
  Conventions:
    - Standard Go layout (`cmd/specter`, `internal/...`)
    - Pure transforms tested with fixtures in `test/fixtures/`
    - Read-only: never signal, modify, or terminate target processes
    - Clean teardown on SIGINT (never leave attached strace processes)
